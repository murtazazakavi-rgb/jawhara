<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center justify-center z-10 px-margin-mobile md:px-margin-desktop py-12 md:py-20 relative">
<!-- Brand Header -->
<header class="text-center mb-12 flex flex-col items-center w-full max-w-md">
<div class="mb-4">
  <span class="font-headline-lg text-display-lg text-primary tracking-widest uppercase">Jawhara</span>
</div>
<h1 class="font-headline-sm text-headline-sm text-primary-container tracking-wider uppercase opacity-80">
                Where Every Thing Pretty Lives
            </h1>
</header>
<!-- Login Card -->
<section class="bg-surface-container-lowest w-full max-w-md rounded-xl p-8 md:p-10 border border-outline-variant/30 shadow-[0_4px_40px_rgba(117,85,102,0.03)] flex flex-col gap-6 relative overflow-hidden">
<div class="absolute top-0 right-0 w-24 h-24 bg-secondary-container/20 rounded-bl-full -mr-4 -mt-4 z-0"></div>
<div class="text-center z-10 mb-2">
<h2 class="font-headline-md text-headline-md text-on-surface mb-2">Access Portal</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Please sign in to continue.</p>
</div>
<form class="flex flex-col gap-5 z-10 w-full" onsubmit="event.preventDefault();">
<!-- Username Field -->
<div class="flex flex-col gap-1 w-full">
<label class="font-label-md text-label-md text-on-surface uppercase" for="username">Username or Email</label>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-0 bottom-3 text-outline text-[20px]">person</span>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-8 py-2 font-body-md text-on-surface transition-colors placeholder:text-outline/50" id="username" name="username" placeholder="Enter your credentials" required="" type="text">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-1 w-full mt-2">
<div class="flex justify-between items-center w-full">
<label class="font-label-md text-label-md text-on-surface uppercase" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative w-full">
<span class="material-symbols-outlined absolute left-0 bottom-3 text-outline text-[20px]">lock</span>
<input class="w-full bg-transparent border-0 border-b border-outline-variant focus:border-primary focus:ring-0 px-8 py-2 font-body-md text-on-surface transition-colors placeholder:text-outline/50" id="password" name="password" placeholder="••••••••" required="" type="password">
<button class="absolute right-0 bottom-3 text-outline hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-6 bg-primary-container text-on-primary font-label-md text-label-md uppercase tracking-wider py-4 rounded-DEFAULT hover:opacity-90 active:scale-[0.98] transition-all duration-200 shadow-sm flex items-center justify-center gap-2" type="submit">
                    Sign In
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<div class="mt-4 pt-6 border-t border-outline-variant/20 flex flex-col items-center justify-center gap-4 z-10 w-full">
<p class="font-body-sm text-[13px] text-on-surface-variant text-center">
                    Authorized personnel only.
                 </p>
</div>
</section>
